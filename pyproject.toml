[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ga4-bigquery-lint"
version = "0.1.0"
description = "Lint GA4 BigQuery SQL with a real BigQuery grammar and catch the event_params, _TABLE_SUFFIX and timestamp mistakes that return wrong numbers"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "duke5am" }]
keywords = [
  "ga4", "google-analytics-4", "bigquery", "sql", "sqlglot", "linter",
  "analytics", "sessionisation", "event_params", "finops",
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Topic :: Database",
  "Topic :: Software Development :: Quality Assurance",
]
# sqlglot is the point of this tool: every statement is parsed with sqlglot's
# real `bigquery` dialect, which is what distinguishes it from a regex linter.
# The code still degrades to structural checks if the import fails (that is how
# it ran in the sandbox it was written in), but shipping it without sqlglot
# would silently downgrade the tool a user just installed, so it is declared.
dependencies = ["sqlglot>=20"]

[project.scripts]
ga4-bigquery-lint = "ga4_bigquery_lint.cli:main"

[project.urls]
Homepage = "https://github.com/duke5am/ga4-bigquery-lint"
Issues = "https://github.com/duke5am/ga4-bigquery-lint/issues"

[tool.setuptools]
packages = ["ga4_bigquery_lint"]
include-package-data = true

[tool.setuptools.package-data]
ga4_bigquery_lint = ["queries/*.sql"]
